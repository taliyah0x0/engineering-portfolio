<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taliyah Huang - Engineering Portfolio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111114'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='28' font-weight='700' letter-spacing='-1' fill='%23ff2e7e'%3ETH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #ff2e7e;          /* the one pink */
    --accent-soft: rgba(255, 46, 126, 0.10);
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --radius-pill: 999px;
    --ease: cubic-bezier(.2,.7,.2,1);
    --font: "Inter", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --surface: #f4f4f5;
    --surface-2: #ebebed;
    --text: #0a0a0a;
    --muted: #6b6b70;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
  }
  [data-theme="dark"] {
    --bg: #000000;
    --surface: #111113;
    --surface-2: #1b1b1e;
    --text: #f5f5f5;
    --muted: #8d8d93;
    --shadow: 0 1px 2px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background .4s var(--ease), color .4s var(--ease);
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  .label {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .label .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-right: 8px; vertical-align: 1px;
  }

  /* ---------- NAV ---------- */
  nav {
    position: sticky; top: 16px; z-index: 50;
    margin: 16px auto 0; max-width: 1120px; padding: 0 24px;
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: var(--radius-pill);
    padding: 10px 10px 10px 22px;
    box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 9px; background: var(--text);
    display: grid; place-items: center; position: relative;
  }
  .brand-mark { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .nav-links { display: flex; gap: 4px; align-items: center; }
  .nav-links a {
    font-size: 14px; color: var(--muted); padding: 8px 14px; border-radius: var(--radius-pill);
    transition: color .2s, background .2s;
  }
  .nav-links a:hover { color: var(--text); background: var(--surface-2); }

  .toggle {
    width: 64px; height: 36px; border-radius: var(--radius-pill);
    background: var(--surface-2); border: none; cursor: pointer;
    position: relative; margin-left: 8px; flex-shrink: 0;
  }
  .toggle .knob {
    position: absolute; top: 4px; left: 4px; width: 28px; height: 28px;
    border-radius: 50%; background: var(--bg); box-shadow: var(--shadow);
    display: grid; place-items: center;
    transition: transform .35s var(--ease);
  }
  [data-theme="dark"] .toggle .knob { transform: translateX(28px); }
  .toggle svg { width: 15px; height: 15px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; }
  .toggle .moon { display: none; }
  [data-theme="dark"] .toggle .sun { display: none; }
  [data-theme="dark"] .toggle .moon { display: block; }

  /* ---------- HERO ---------- */
  .hero { padding: 88px 0 40px; }
  .hero-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: stretch; }
  .hero h1 {
    font-size: clamp(44px, 7vw, 84px); line-height: .98; letter-spacing: -.045em; font-weight: 600;
    margin: 18px 0 22px;
  }
  .hero h1 .accent { color: var(--accent); }
  .hero p.lede { font-size: 18px; color: var(--muted); max-width: 520px; }
  .hero-ctas { display: flex; gap: 10px; margin-top: 32px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px; border-radius: var(--radius-pill); font-size: 15px; font-weight: 500;
    transition: transform .2s var(--ease), background .2s, color .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-primary:hover { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--surface); }

  /* "Patient chart" ID card */
  .id-card {
    background: var(--surface); border-radius: var(--radius-lg); padding: 26px;
    display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden;
  }
  .id-top { display: flex; justify-content: space-between; align-items: center; }
  .status {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500;
    background: var(--accent-soft); color: var(--accent); padding: 6px 12px; border-radius: var(--radius-pill);
  }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,46,126,.55); }
    70% { box-shadow: 0 0 0 9px rgba(255,46,126,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,46,126,0); }
  }
  .avatar {
    width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-md); background: var(--surface-2);
    display: grid; place-items: center; overflow: hidden; position: relative;
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: right bottom; }
  .avatar .initials { font-size: 56px; font-weight: 600; letter-spacing: -.04em; color: var(--muted); }
  .ecg { width: 100%; height: 46px; }
  .ecg path {
    fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 3.2s linear infinite;
  }
  @keyframes draw { to { stroke-dashoffset: -600; } }
  .id-rows { display: flex; flex-direction: column; gap: 10px; }
  .id-row { display: flex; justify-content: space-between; font-size: 14px; gap: 16px; text-align: right; }
  .id-row span:first-child { color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; text-align: left; }

  /* ---------- VITALS ---------- */
  .vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
  .vital {
    background: var(--surface); border-radius: var(--radius-lg); padding: 24px;
    transition: transform .3s var(--ease);
  }
  .vital:hover { transform: translateY(-4px); }
  .vital .num { font-size: 40px; font-weight: 600; letter-spacing: -.04em; margin-top: 10px; }
  .vital .num sup { font-size: 18px; color: var(--accent); margin-left: 2px; }
  .vital .desc { color: var(--muted); font-size: 14px; }

  /* ---------- SECTIONS ---------- */
  section { padding: 72px 0; }
  .section-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 32px; gap: 20px; flex-wrap: wrap; }
  .section-head h2 { font-size: clamp(32px, 4.4vw, 48px); letter-spacing: -.035em; font-weight: 600; line-height: 1.05; margin-top: 10px; }

  /* filters */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; background: var(--surface); padding: 6px; border-radius: var(--radius-pill); }
  .filters button {
    border: none; background: transparent; color: var(--muted); font: 500 13.5px var(--font);
    padding: 9px 16px; border-radius: var(--radius-pill); cursor: pointer; transition: all .2s;
  }
  .filters button.active { background: var(--bg); color: var(--text); box-shadow: var(--shadow); }

  /* projects */
  .projects { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; }
  .project {
    grid-column: span 3; background: var(--surface); border-radius: var(--radius-lg); padding: 14px;
    display: flex; flex-direction: column; cursor: pointer;
    transition: transform .35s var(--ease), opacity .3s;
  }
  .project.wide { grid-column: span 4; }
  .project.narrow { grid-column: span 2; }
  .project:hover { transform: translateY(-6px); }
  .project.hide { display: none; }
  .project-media {
    border-radius: var(--radius-md); background: var(--surface-2); aspect-ratio: 16/10; overflow: hidden;
    position: relative; display: grid; place-items: center;
  }
  .project-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
  .project-media video { transition: transform .6s var(--ease); }
  .project:hover .project-media img, .project:hover .project-media video { transform: scale(1.04); }
  .project-media .ph { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .project-tag {
    position: absolute; top: 12px; left: 12px; background: var(--bg); font-size: 12px; font-weight: 500;
    padding: 6px 12px; border-radius: var(--radius-pill); z-index: 1;
  }
  .project-body { padding: 18px 10px 8px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .project-body h3 { font-size: 21px; letter-spacing: -.02em; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .arrow {
    width: 34px; height: 34px; border-radius: 50%; background: var(--bg); flex-shrink: 0;
    display: grid; place-items: center; transition: background .25s, transform .35s var(--ease);
  }
  .arrow svg { width: 14px; height: 14px; stroke: var(--text); stroke-width: 2; fill: none; }
  .project:hover .arrow { background: var(--accent); transform: rotate(-45deg); }
  .project:hover .arrow svg { stroke: #fff; }
  .project-body p { color: var(--muted); font-size: 14.5px; }
  .card-date { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 10px; }
  .chip { font-family: var(--mono); font-size: 11.5px; background: var(--bg); padding: 5px 10px; border-radius: var(--radius-pill); color: var(--muted); }

  /* learning in public */
  .section-sub { color: var(--muted); font-size: 17px; max-width: 640px; margin-top: 14px; }
  .principles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
  .principle { background: var(--surface); border-radius: var(--radius-lg); padding: 24px 26px; }
  .principle .pnum { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; }
  .principle h3 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 10px 0 8px; }
  .principle p { color: var(--muted); font-size: 14.5px; }
  .learn { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
  .learn-card { background: var(--surface); border-radius: var(--radius-lg); padding: 26px; display: flex; flex-direction: column; gap: 12px; }
  .learn-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .learn-media { display: block; border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 3 / 1; background: var(--surface-2); margin-bottom: 4px; }
  .learn-media img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; transition: transform .6s var(--ease); }
  .learn-media:hover img { transform: scale(1.04); }
  .learn-stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .learn-stats span { background: var(--accent-soft); color: var(--text); font-size: 13px; padding: 6px 12px; border-radius: var(--radius-pill); }
  .learn-stats b { color: var(--accent); font-weight: 600; }
  .learn-kind { background: var(--accent); color: #fff; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: var(--radius-pill); }
  .learn-card h3 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .learn-card > p { color: var(--muted); font-size: 14.5px; }
  .learn-parts { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .learn-parts a { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; background: var(--bg); border-radius: var(--radius-sm); padding: 11px 14px; font-size: 13.5px; transition: background .2s, color .2s; }
  .learn-parts a span { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
  .learn-parts a b { font-weight: 500; }
  .learn-parts a i { font-style: normal; color: var(--muted); }
  .learn-parts a:hover { background: var(--accent); color: #fff; }
  .learn-parts a:hover span, .learn-parts a:hover i { color: #fff; }
  .learn-link { margin-top: auto; padding-top: 6px; font-size: 14px; font-weight: 500; color: var(--accent); }

  /* capabilities */
  /* 3 cards on top, 2 wider cards below */
  .caps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; }
  .cap { grid-column: span 2; background: var(--surface); border-radius: var(--radius-lg); padding: 26px; display: flex; flex-direction: column; }
  .cap:nth-child(4), .cap:nth-child(5) { grid-column: span 3; }
  .cap-icon {
    width: 44px; height: 44px; border-radius: 14px; background: var(--accent-soft);
    display: grid; place-items: center; margin-bottom: 18px;
  }
  .cap-icon svg { width: 20px; height: 20px; stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cap h3 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 14px; }
  .meter { margin-top: 12px; }
  .meter-top { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 7px; }
  .meter-top span:last-child { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .meter-bar { height: 8px; border-radius: var(--radius-pill); background: var(--surface-2); overflow: hidden; }
  .meter-fill { height: 100%; width: 0; border-radius: var(--radius-pill); background: var(--text); transition: width 1.2s var(--ease); }
  .meter:first-of-type .meter-fill { background: var(--accent); }
  .cap .chips { padding-top: 20px; }
  .cap .chip { background: var(--bg); }

  /* experience — no lines, just stacked rounded rows */
  .exp { display: flex; flex-direction: column; gap: 12px; }
  .exp-item {
    background: var(--surface); border-radius: var(--radius-md); padding: 22px 26px;
    display: grid; grid-template-columns: 170px 1fr auto; gap: 24px; align-items: center;
    transition: background .25s;
  }
  .exp-item:hover { background: var(--surface-2); }
  .exp-item .when { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .exp-item h4 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .exp-item p { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .exp-item p.note { color: var(--text); opacity: .75; font-size: 13.5px; margin-top: 6px; }
  .exp-item .badge { font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: var(--radius-pill); background: var(--bg); white-space: nowrap; }
  .exp-item .badge.now { background: var(--accent); color: #fff; }

  /* contact */
  .contact {
    background: var(--text); color: var(--bg); border-radius: var(--radius-lg);
    padding: clamp(32px, 6vw, 64px); display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: end;
  }
  .contact h2 { font-size: clamp(36px, 5.5vw, 64px); letter-spacing: -.045em; line-height: 1; font-weight: 600; }
  .contact h2 .accent { color: var(--accent); }
  .contact .label { color: color-mix(in srgb, var(--bg) 55%, transparent); }
  .contact-links { display: flex; flex-direction: column; gap: 10px; }
  .contact-links a {
    display: flex; justify-content: space-between; align-items: center;
    background: color-mix(in srgb, var(--bg) 8%, transparent);
    padding: 16px 20px; border-radius: var(--radius-md); font-size: 15px;
    transition: background .25s, color .25s;
  }
  .contact-links a:hover { background: var(--accent); color: #fff; }
  .contact-links a span:last-child { font-family: var(--mono); font-size: 12px; opacity: .7; }

  footer { padding: 36px 0 48px; display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; flex-wrap: wrap; gap: 12px; }

  /* reveal on scroll */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  /* =========================================================
     CASE STUDY DETAIL PAGE
     ========================================================= */
  .detail { padding-top: 48px; animation: fadeUp .6s var(--ease); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .back {
    display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted);
    background: var(--surface); padding: 9px 16px; border-radius: var(--radius-pill); transition: color .2s, background .2s;
  }
  .back:hover { color: var(--text); background: var(--surface-2); }
  .d-hero { padding: 40px 0 28px; max-width: 860px; }
  .d-hero h1 { font-size: clamp(40px, 6.4vw, 76px); line-height: 1; letter-spacing: -.045em; font-weight: 600; margin: 16px 0 18px; }
  .d-hero .lede { font-size: 19px; color: var(--muted); max-width: 640px; }
  .d-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 8px 0 20px; }
  .d-meta div { background: var(--surface); border-radius: var(--radius-md); padding: 16px 18px; }
  .d-meta b { display: block; font-weight: 500; font-size: 14.5px; margin-top: 6px; }
  .d-cover {
    border-radius: var(--radius-lg); overflow: hidden; background: var(--surface-2); aspect-ratio: 16/9; position: relative;
  }
  .d-cover iframe, .d-cover img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  .d-cover.missing::before {
    content: "ADD COVER IMAGE"; position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--muted);
  }
  .d-cover video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .yt { position: relative; aspect-ratio: 16/9; border-radius: var(--radius-md); overflow: hidden; background: var(--bg); margin-top: 6px; }
  .yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .prose p.todo { background: var(--accent-soft); color: var(--accent); border-radius: var(--radius-sm); padding: 12px 16px; font-family: var(--mono); font-size: 13px; }
  .exp-item .when em { display: block; font-style: normal; color: var(--accent); margin-top: 4px; }
  .d-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0 8px; }
  .d-stat { background: var(--surface); border-radius: var(--radius-lg); padding: 22px 24px; }
  .d-stat .num { font-size: 32px; font-weight: 600; letter-spacing: -.035em; color: var(--accent); }
  .d-stat .desc { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .d-body { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
  .d-sec {
    padding: 36px; background: var(--surface); border-radius: var(--radius-lg);
    display: grid; grid-template-columns: 120px 1fr; gap: 28px;
  }
  .d-num { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); padding-top: 8px; }
  .d-num span { display: block; width: 28px; height: 4px; border-radius: 4px; background: var(--accent); margin-bottom: 12px; }
  .d-sec h2 { font-size: clamp(24px, 3vw, 32px); letter-spacing: -.03em; font-weight: 600; line-height: 1.15; margin-bottom: 16px; }
  .prose { font-size: 16px; max-width: 720px; }
  .prose p { margin-bottom: 14px; color: color-mix(in srgb, var(--text) 82%, transparent); }
  .prose ul, .prose ol { margin: 4px 0 18px; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: n; }
  .prose li { background: var(--bg); border-radius: var(--radius-sm); padding: 12px 16px 12px 44px; position: relative; font-size: 15px; }
  .prose ul li::before { content: ""; position: absolute; left: 18px; top: 19px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .prose ol li { counter-increment: n; }
  .prose ol li::before { content: counter(n, decimal-leading-zero); position: absolute; left: 14px; top: 13px; font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .prose li b { font-weight: 600; }
  .prose a { color: var(--accent); }

  .media { margin: 18px 0 22px; position: relative; }
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 18px 0 22px; align-items: start; }

const kinLine = (series, { ymin, ymax, ticks, fmt = v => v }) => {

    g += `<line x1="${cx(i)}" y1="${Y(b.m + b.sd)}" x2="${cx(i)}" y2="${Y(b.m - b.sd)}" stroke="var(--text)" stroke-width="1.2" opacity=".55"/>`;

    g += `<text x="${cx(i)}" y="${H - 8}" text-anchor="middle">${b.n}</text>`;
  });
  g += `<line x1="${L}" y1="${Y(0)}" x2="${W - R}" y2="${Y(0)}" stroke="var(--muted)" stroke-opacity=".5" stroke-width="1"/>`;
  sig.forEach(([a, b, stars, lv]) => {

  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
};

        org: "HAMR Lab, Johns Hopkins", role: "Undergraduate Researcher · co-author", when: "Jan 2026 — Sep 2026 · 9 mos",

          { h: "Motivation", html: `
            <p>Upper-limb prosthetic hands keep getting more anthropomorphic, but natural adaptation to objects during grasping is still a challenge. A human hand combines coordinated joint motion with built-in compliance, so the fingers passively wrap around an object, spread contact forces, and hold a stable grasp. Rigid prosthetic hands lack that compliance, which limits contact area and grasp stability in everyday activities.</p>
            ${fig(HAND + "motivation.jpg", "Our tendon-actuated modular prosthesis setup, with the earlier rigid hand")}` },
          { h: "From TAPH to TAPH-F", html: `
            <p>The lab's earlier Tendon Actuated Prosthetic Hand (TAPH) replicated human tendon routing and joint kinematics, but its knuckle (MCP) joints were rigid. That blocked side-to-side finger motion and limited how well it could conform to objects. TAPH-F fixes this through the shape and material of the hand itself:</p>
            <ul>
              <li><b>Passive MCP joints:</b> each knuckle is a constrained ball-and-socket joint placed at its anatomically derived center of rotation from the lab's HAMR reconstruction process. A guide channel in the palm keeps flexion and extension on track, while built-in clearance lets each finger spread passively, tuned to its natural range of motion.</li>
              <li><b>Compliant material:</b> the whole hand is printed in TPU (NinjaTek Chinchilla, Shore 75A). It deforms locally to conform to surfaces while staying stiff enough for tendon-driven actuation.</li>
              <li><b>Self-restoring fingers:</b> the TPU's elasticity works with the passive joints to return the fingers to neutral after they spread, with no springs, extra sensors, actuators, or control inputs.</li>
            </ul>
            ${fig(HAND + "taph-evolution.jpg", "The evolution from the rigid PLA TAPH to the compliant TPU TAPH-F, and the passive ball-and-socket MCP joint")}
            ${gal(fig(HAND + "design-annotated.jpg", "Flexion and extension tendon lines, pins, ball joints, the thumb's circumduction axis, and a whippletree"),
                  fig(HAND + "build.jpg", "Printed finger and joint components"))}` },
          { h: "Building & controls", html: `
            <p>Before the ball-jointed design, I built an EMG-controlled flexible hand and a Simulink program to drive it. That gave me a working control pipeline for the new hand's motors.</p>
            ${gal(fig(HAMR + "IMG_0163.mp4", "EMG-controlled flexible hand"),
                  fig(HAMR + "hand.mp4", "Wiring up the ball-jointed hand"))}
            ${fig(HAND + "controls-models.jpg", "Simulink models and motor voltage traces")}` },
          { h: "Grasp taxonomy", html: `
            <p>We tested TAPH-F on representative grasps adapted from the Cutkosky manufacturing grasp taxonomy and later prosthetic-hand benchmarks, using a representative object for each grasp. Unlike earlier TAPH versions, which were limited by rigid finger alignment, TAPH-F achieved every grasp in the taxonomy, across both power and precision grasps.</p>
            ${fig(HAND + "grasp-taxonomy.jpg", "Every grasp in the adapted Cutkosky taxonomy, achieved by TAPH-F")}` },
          { h: "Contact pressure", html: `
            <p>To measure how the passive joints change contact, we wrapped multilayer piezoresistive force sensor arrays around a cylindrical object and recorded where and how hard the hand pressed during a grasp. Instead of concentrating force at a few isolated points, passive finger spreading increased the contact area and produced a more evenly distributed grasp.</p>
            ${fig(HAND + "pressure-setup.jpg", "Pressure mapping setup and average pressure per sensor cell during a cylindrical grasp")}
            ${gal(fig(HAND + "tension-tests.jpg", "Tendon tension tests: open (extend) and close (flex)"),
                  fig(HAND + "pick-up-objects.jpg", "Picking up everyday objects"))}` },
          { h: "Functional tasks", html: `
            <p>We ran three standardized manipulation tasks developed in our lab, increasing in complexity. The added compliance had little effect on dexterity-focused tasks like block transfer and checker transfer and stacking. In carton transfer and pour, TAPH-F was noticeably more stable, because the spreading fingers conformed to the carton's rectangular shape and kept a more secure grip throughout.</p>
            ${gal(vid(HAND + "task-box-and-blocks.mp4", HAND + "task-box-and-blocks.jpg", "Box and blocks"),

                  vid(HAND + "task-carton-pour.mp4", HAND + "task-carton-pour.jpg", "Carton transfer and pour"))}` },
          { h: "Results & next steps", html: `
            <ul>
              <li><b>Wider grasp range:</b> passive MCP joints and compliant material let TAPH-F achieve every grasp in the adapted Cutkosky taxonomy.</li>
              <li><b>Better contact:</b> passive spreading spread pressure more evenly across the fingers.</li>
              <li><b>More stable handling</b> of larger objects like cartons, without adding actuators or controller complexity.</li>
              <li><b>The trade-off:</b> compliance reduces force transmission through the tendons, which limits maximum grip force on heavier objects.</li>

            <p>Together, these results show that the hand's morphology alone can improve how a prosthesis interacts with objects. Next steps include localized stiffness tuning and hybrid materials to balance compliance with force for heavier objects, plus long-term durability testing.</p>` },

        sections: [
          { h: "Background", html: `
            <p>About 100,000 people are diagnosed with interstitial lung diseases (ILD) each year in the U.S., and lung cancer remains the leading cause of cancer deaths. Lung cryobiopsy is a promising diagnostic technique that uses freezing-cold carbon dioxide gas to preserve and extract a high-quality tissue sample through the patient's natural airway.</p>

            <p>Cryobiopsy offers the best of forceps and surgical biopsies without the trade-offs.</p>` },

            ${gal(fig(JHBME + "cryoextract-sample-on-probe.jpg", "A tissue sample frozen to the cryoprobe tip", { ratio: "1/1" }),

            <p>I led a team of 8 students, with clinical mentors Dr. Lonny Yarmus, Dr. Jeffrey Thiboutot and Dr. Christopher Kapp and course mentors Dr. Elizabeth Logsdon and Ethan Wu. We observed cryobiopsy procedures and interviewed pulmonologists, nurses, and pathologists at the Johns Hopkins Hospital, then mind-mapped our observations into needs.</p>
            ${fig(JHBME + "mindmap.mp4", "Mind-mapping observations to find needs")}` },
          { h: "User needs", html: `
            <ul>
              <li><b>Reliable:</b> no damage to the tissue and no safety concerns for patient or user</li>
              <li><b>Efficient:</b> extracts tissue samples in few attempts</li>
              <li><b>Universally compatible</b> with all cryoprobe types and sample container sizes</li>
              <li><b>Easy to use:</b> minimal complexity and no added steps to the existing workflow</li>

          { h: "Our solution: ICOR", html: `

          { h: "Testing & results", html: `
            <p>We compared ICOR against the notched fork on specimens of increasing realism: preserved pig lungs (March 27, 2025), a live pig experiment (April 8, 2025), and human patient procedures (April 2, 16, and 18, 2025). ICOR removed samples with fewer attempts and in less time, while preserving larger samples.</p>

          { h: "What pulmonologists said", html: `
            <p>Expert pulmonologists Dr. Ardian Latifi, Dr. Lonny Yarmus and Dr. Gaurav Raman tested ICOR and described it as:</p>
            <div class="quotes"><span>"easy and intuitive"</span><span>"can one-hand the procedure"</span><span>"quality of samples is significantly better"</span><span>"far faster"</span><span>"a lot more convenient"</span><span>"miles ahead of the fork"</span></div>` },
          { h: "Sharing the results", html: `
            <ul>
              <li>Oral presentation at the 2025 Interventional Pulmonology Outcomes Group (IPOG) conference</li>

        video: "0xLckbni-EI",
        sections: [
          { h: "Why it matters to me", html: `
            <p>I've been passionate about mechatronics since I was 13, and STEMables is still the project I'm most proud of. I invented and produced it before college, and before AI.</p>
            <p>My mission is to make learning electronics and programming modular, tactile, and accessible, so kids no longer have to worry about tiny wires and writing code.</p>` },
          { h: "How it works", html: `
            <p>STEMables are magnetic blocks that you connect to physically "write" a program. You start with a power block and add a sensor, like the distance (proximity) sensor. Then a comparison block and a number block set to a value turn the reading into a true-or-false signal, which can light up an LED block.</p>
            <p>With Boolean operators, connectors, splitters, and other sensor types, even complex systems can be built block by block.</p>` },

            ${gal(fig(wxp("1fe5c6f2348a43049a6005afa65b55ee~mv2.png"), "Operator"), fig(wxp("9e9c2cba19d94b81925d9a0e02ca08ea~mv2.png"), "If"), fig(wxp("5a056718f2494c2e88fd3825294edc41~mv2.png"), "Split"))}
            ${gal(fig(wxp("a98731052a114989b330620d33b51661~mv2.png"), "Extender"), fig(wxp("1034d70b7c044769b013ad39da1d2a13~mv2.png"), "USB"), fig(wxp("33ed941239234b3287df07706339fe4e~mv2.png"), "AC plug"))}` },
          { h: "Designed for touch", html: `
            <p>I designed the unique shape of each 3D-printed block with visually impaired and dexterously challenged kids in mind, so blocks can be told apart by touch. Pairing sensors with the speaker block opens up new possibilities, like letting blind kids hear colors.</p>` },

      slug: "constellation-destroyer",
      title: "Constellation Destroyer", size: "", category: "Startups", tag: "Surgical Robotics",
      img: MOON + "display.jpg",
      desc: "A reusable, space-themed training game that walks surgeons through Maestro's key features in a 5–8 minute demo, replacing a $400 single-use dissection model.",
      tools: ["CAD", "3D Printing"],
      detail: {
        subtitle: "Designing a reusable demo and training kit for Moon Surgical's Maestro surgical robotic assistant.",
        org: "Moon Surgical", role: "Clinical Development Engineering Intern (independent project)", when: "Jun 2024 — Aug 2024 · 3 mos",
        video: "8-r4F3nH55E", coverVideo: true,
        sections: [
          { h: "Project background", html: `
            <p>Moon Surgical is a French-American startup building Maestro, a surgical robotic assistant. As they expanded marketing across the U.S., surgeons could try the system at conferences, but without performing an actual procedure it was hard to feel how helpful Maestro really is.</p>
            <p>The existing option, a single-use dissectable model, cost $400 each and was tedious to set up. At the same time, Maestro was being onboarded at new hospitals quickly, so a realistic training kit that could be reset and repeated for every surgeon and nurse was in high demand.</p>` },
          { h: "Needs definition", html: `
            <p>I started by defining the needs and the reasoning behind each one:</p>
            <ul>
              <li><b>Simulative</b>: trainees gain experience that carries over to a real procedure</li>
              <li><b>Affordable</b>: the company can run more demos and trainings</li>
              <li><b>Reusable</b>: saves cost and storage space and reduces environmental impact</li>
              <li><b>Quick set-up</b>: demos and trainings aren't limited by time</li>
              <li><b>Robust</b>: looks professional and is easy to identify with the brand</li>
            </ul>
            <p>These became design requirements. The user should be prompted to:</p>
            <ul>
              <li>Let go of the laparoscope and use both hands on active instruments while Maestro holds the scope</li>
              <li>Enable High-Force mode to hold up a heavy object</li>
              <li>Toggle ScoPilot at least twice to track a hook vs. a grasper across the screen</li>
              <li>Naturally exchange instruments between hook, shears, and grasper</li>
            </ul>
            <p>The kit also had to cost no more than $400, take one person under 5 minutes to set up, fit inside the existing abdominal demo model, and include a playful space element to match Moon Surgical's theme.</p>` },
          { h: "Ideation & prototyping", html: `
            <p>I began with the gold standard: how Intuitive Surgical trains surgeons on da Vinci with SimNow, a set of virtual-reality games ranging from apple picking (grasper and shears practice) to full procedural simulations. I also pulled ideas from Montessori toys that encourage two-handed manipulation, and from parrot trick accessories, which pack intuitive tasks into a tiny form.</p>
            ${fig(MOON + "inspo.jpg", "My Notion board of existing products that inspired me")}
            <p>Early concepts included boxes that had to be held open for a two-handed task inside, and having Maestro keep a rubber band stretched while toothpicks were pushed through it.</p>
            ${fig(MOON + "sketches.jpg", "Early concept sketches")}
            <p>Animations and printed prototypes showed me I needed to go back to the drawing board: the kit needed several mini-games combined to drive instrument exchange and the other prompted tasks.</p>
            ${fig(MOON + "0001-0820.mp4", "Rough Blender animation; the teal grasper attaches to Maestro's arm")}
            <p>I iterated again and again, testing ease of use with Maestro and real instruments myself. Along the way I learned that kinetic sand was too messy for a hook-dissection task, and that port placement had a big effect on how hard the game was.</p>
            ${fig(MOON + "prototypes.jpg", "Prototype iterations")}` },
          { h: "Final product", html: `
            ${fig(MOON + "IMG_8947.mp4")}
            <p>The finished Constellation Destroyer is lightweight, one piece, and slides into the abdominal case in seconds. The only disposable parts are rubber bands, and resetting it just means reinserting the spiral bands.</p>
            ${fig(MOON + "final.jpg")}
            <p>I also designed a quick reference guide for the four steps of the game:</p>
            <ol>
              <li>Lift the silicone "night sky" with a grasper and have Maestro hold it in High-Force mode</li>
              <li>Use hook and shears to remove the rubber bands linking the constellation</li>
              <li>Use graspers to pull out each constellation band from different angles</li>
              <li>Enable ScoPilot to follow a grasper across the map, where a second grasper opens the "black hole" lid so the bands can be dropped in one by one</li>
            </ol>
            ${fig(MOON + "qrg.png", "Quick reference guide")}
            <p>Coworkers trying it for the first time took 5–8 minutes on average, which is right for a conference demo: welcoming, and not frustrating.</p>
            ${fig(MOON + "testing.jpg", "Helin (fellow intern) and Victoria (my manager) testing the game")}` },
          { h: "Lessons learned", html: `
            <p>I struggled early on to fit every element in without overcomplicating something that should feel fun and intuitive. I was stuck on the box idea for a long time, printing prototype after prototype of sliding lids, when I really needed to think <i>outside</i> the box. Talking with coworkers unlocked fresh ideas like the multidimensional rubber-band activity and an elevated platform for instrument reach.</p>
            <p>Next steps would be more testing with surgeons and non-surgeons, then iterating on their feedback.</p>
            ${fig(MOON + "0816.mp4", "Playing the game start to finish")}` },
        ],
        links: [],
      },
    },
    {
      slug: "uterine-manipulation-model",
      title: "Uterine Manipulation Model", size: "", category: "Startups", tag: "Surgical Robotics",
      img: UT + "thumbnail.jpg",
      desc: "A demo model that lets Maestro hold a uterine manipulator. Compatible with 8 commercial manipulators.",
      tools: ["CAD", "3D Printing"],
      detail: {
        subtitle: "A benchtop model showing how Maestro could take over the tiring job of holding a uterine manipulator during gynecologic surgery.",
        org: "Moon Surgical", role: "Clinical Development Engineering Intern (independent project)", when: "Jun 2024 — Aug 2024 · 3 mos",
        cover: UT + "final.mp4",
        
        sections: [
          { h: "Project background", html: `
            <p>Moon Surgical had announced plans to expand Maestro into gynecologic surgery, where the robot would hold the uterine manipulator. I was asked to design a model to demo this.</p>
            <p>In a typical procedure an assistant, usually a medical student, crouches at the patient's legs and holds the manipulator to lift the uterus, so the surgeon can see the surrounding tissue. This can go on for minutes to hours. Fatigue causes delays and ergonomic strain, and it uses a highly trained person for a tedious task.</p>` },
          { h: "Needs definition", html: `
            <p>The users were Moon's clinical development engineers running demos and the surgeons trying it themselves. The needs were:</p>
            <ul>
              <li><b>Representation</b>: observers connect the model to a real procedure</li>
              <li><b>Affordability</b>: cheap and easy to mass-produce within a strict demo budget</li>
              <li><b>Ease of use</b>: observers can confidently use it after watching once or twice</li>
            </ul>
            <p>Because this was a new application, I studied everything from the conditions and procedural steps to OR set-up. We also interviewed several surgeons about their manipulator preferences for hysterectomies, myomectomies, and more. Retracting the uterus upward came out as the most important motion.</p>
            ${fig("https://www.mdpi.com/applsci/applsci-14-03851/article_deploy/html/images/applsci-14-03851-g002.png", "Upward retraction was the key manipulator action (image: MDPI Applied Sciences)")}
            <p>Requirements:</p>
            <ul>
              <li>Simulate pitch rotation, and ideally roll and yaw</li>
              <li>Work with the existing benchtop abdominal model used for Maestro demos</li>
              <li>Represent the typical shape and size of the anatomy with a manipulator inside</li>
              <li>Fit the 8 most common manipulators: RUMI II, Advincula Delineator, HOHL, MAUT 60, ElevatOR, VCare, ClearView, Cohen Acorn</li>
              <li>Let the tip reach the uterus while the occluder cup is secured</li>
            </ul>
            ${fig(UT + "manipulators.png", "VCare, Advincula Delineator, MAUT 60, RUMI II")}` },
          { h: "Ideation & prototyping", html: `
            <p>The silicone anatomy models on the market were accurate in size and texture but didn't show where the uterus sits inside the abdomen, and they were expensive.</p>
            ${fig(UT + "models.jpg", "Existing commercial models")}
            <p>A DIY trainer made from a water bottle and fabric inside a storage bin inspired me to build a more professional version. All I needed was a realistic uterus that attached inside the existing abdomen model.</p>
            ${fig(UT + "manipulate.mp4", "Uterine manipulator simulation by Allen Huy Doan, University of Arizona College of Medicine")}
            <p>My first attempt was a silicone casting from a 3-piece printed mold designed in Blender. Because the inner cavity was wider than the opening, the mold couldn't be removed, the thin fallopian tubes broke off, and the silicone wasn't stretchy enough to hold the occluder cup.</p>
            ${fig(UT + "casting.jpg", "The Blender-designed mold for the silicone version")}
            <p>So I switched to printing the uterus in flexible resin. It was stiffer than silicone, but it was transparent, so you could see the probe and how far it reached, which was an unplanned bonus. I modeled the supporting anatomy in its most opened position and fixed it to the outside of the abdomen, refining the pipe-flange connector with every iteration.</p>
            ${fig(UT + "printing.jpg", "Iterating on the flange connector and form")}` },
          { h: "Final product", html: `
            <p>The final model works with all 8 manipulators. The user secures the occluder cup, controls pitch and yaw, and sees the result through a laparoscope from the other side. The surgeon can position the uterus exactly as they want and hand it off to Maestro, which doesn't get tired. That removes the need for a bedside assistant and keeps the procedure flowing.</p>
            ${fig(UT + "final.mp4", "The flexible abdominal wall made manipulation easy")}
            <p>Roll control was the one milestone I didn't reach. I'd also move the whole complex to a more anatomically correct position, which the existing abdomen model limited. I left the CAD behind so the team could keep improving it.</p>
            ${fig(UT + "demos.jpg", "Fit-testing each manipulator")}` },
          { h: "Lessons learned", html: `
            <p>Missing a design goal can open up possibilities you hadn't considered. Silicone couldn't give me the color and flexibility of real tissue, but transparent rigid resin made a durable model that locked onto the abdomen and showed the manipulator moving inside.</p>` },
        ],
        links: [],
      },
    },

      tools: ["CAD", "3D Printing", "Arduino"],
      detail: {
        subtitle: "A simple, affordable, open-source way for people with quadriplegia to use a typical smartphone or computer.",
        org: "Personal project", role: "Designer & builder", when: "Nov 2020 — May 2021 · 7 mos",
        cover: wx("2fed066011714dda94996f413db0d06d~mv2.png"),
        video: "0uANgR1oOII", videoStart: 25, coverVideo: true,
        sections: [
          { h: "The story", html: `
            <p>CPACE started with a friend I met through a school buddy program, who has cerebral palsy. Existing assistive options either covered only a few apps or cost as much as $17,500, so my first goal was an affordable device that could tap a smartphone screen for her: a motorized stylus she could control.</p>
            ${fig(wxp("f2c36d0cf35c484c9a1c18e63ae497b2~mv2.png"), "Existing eye-tracking solutions can cost $17,500")}
            <p>She couldn't use that first version. It was too hard to control, which taught me to design around what the user can actually do, not what the device can do.</p>
            ${gal(fig(W + "909011bc27e54b14b30ba0f649bfef92~mv2.gif", "Version 1: a motorized stylus, calibrated with a button"),
                  fig(wx("b176552ce64944a998b1a29fd28fcdf5~mv2.jpg"), "The first prototype"),
                  fig(wxp("1881c12e84b54707866c90ee9e9eab4c~mv2.png"), "Version 1 wiring"))}` },
          { h: "Exploring alternatives", html: `
            <p>Next I tried glasses with sensors for eye tracking. I dropped the idea because the tracking wasn't reliable enough to trust.</p>
            ${gal(fig(wx("c7b522cdb25f4231be62fb4664d1e620~mv2.jpg"), "Sensors on the eye-tracking glasses"),
                  fig(wxp("ed0d4cead9cd45d1a789583dce05c0ad~mv2.png"), "Eye-tracking glasses schematic"))}` },
          { h: "The final design", html: `
            <ul>
              <li><b>Headband:</b> a comfy bunny headband tracks head movement to move the on-screen cursor</li>
              <li><b>Mouthpiece:</b> a bite sensor handles clicks and drags; it's adjustable and washable</li>
              <li><b>Smartphone:</b> plugs straight in and uses the iPhone's built-in AssistiveTouch, with no extra software</li>
              <li><b>Computer:</b> plugs into a USB port with no extra setup</li>
            </ul>
            ${gal(fig(wxp("2fed066011714dda94996f413db0d06d~mv2.png"), "CPACE's headband, mouthpiece, and smartphone stand"),
                  fig(wx("351be2d4b4a64d0abe6c218bed484bae~mv2.jpg"), "On iPhone, CPACE works through the built-in AssistiveTouch"))}` },
          { h: "Build", html: `
            <p>CPACE runs on an Arduino Leonardo with a BNO055 orientation sensor for head tracking and a pressure sensor inside the mouthpiece. I designed the smartphone stand, headband box, mouthpiece, and computer box in CAD and 3D printed them, and drew wiring schematics for both versions. Everything is open source, with CAD files on Thingiverse.</p>
            ${gal(fig(wxp("ab85da2e06114300868863aead1edd0b~mv2.png"), "Smartphone version schematic"),
                  fig(wxp("ec5ac42aa493410eab0743a7c1b21487~mv2.png"), "Computer version schematic"))}
            ${gal(fig(wxp("18932f0bc35d42bfaf7ba10ed4eb8e8f~mv2.png"), "Smartphone stand"),
                  fig(wxp("4b7c9758a6bf456aa1f7cfc5519952cf~mv2.png"), "Headband box"),
                  fig(wxp("4901a4b8e34945afb5ac9fbc50b6989e~mv2.png"), "Mouthpiece"))}
            ${gal(fig(wxp("a57dee73c9914b2bae6e29f1d31c3a18~mv2.png"), "Smartphone stand render"),
                  fig(wxp("27b30ea0f2074b4790234a671c0405b0~mv2.png"), "Stand drawing"),
                  fig(wxp("ad935682995b4153838012518d6cb5b0~mv2.png"), "Computer box"))}` },
          { h: "Known limitations", html: `
            <ul>
              <li>Smartphone support is limited to iPhones; iPads need code changes</li>
              <li>The mouthpiece causes drooling during long sessions</li>
              <li>The cursor sometimes drifts off-center</li>
            </ul>` },
        ],
        links: [["Project website", "https://taliyahengineering.wixsite.com/cpace"], ["How it works (YouTube)", "https://www.youtube.com/watch?v=hZ5zckIzZoA"]],

<script>
  /* ---------- THEME ---------- */
  const root = document.documentElement;
  const getSaved = () => { try { return localStorage.getItem("theme"); } catch (e) { return null; } };
  const save = v => { try { localStorage.setItem("theme", v); } catch (e) {} };
  root.dataset.theme = getSaved() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.getElementById("themeToggle").addEventListener("click", () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next; save(next);
  });

  /* ---------- MISSING MEDIA → placeholder ---------- */
  document.addEventListener("error", e => {
    const el = e.target;
    if (!(el instanceof HTMLImageElement || el instanceof HTMLVideoElement)) return;
    if (el.dataset && el.dataset.fallback) { el.outerHTML = decodeURIComponent(el.dataset.fallback); return; }
    const box = el.closest(".media, .project-media, .avatar, .d-cover");
    if (!box) return;
    const f = (box.dataset.file || "").split("?")[0].split("/").pop();
    box.dataset.short = f.length > 34 ? f.slice(0, 31) + "…" : f;
    box.classList.add("missing"); el.remove();
  }, true);

  /* ---------- RENDER FROM PROFILE ---------- */
  const P = PROFILE, $ = id => document.getElementById(id);
  P.projects = P.projects.filter(p => !p.hidden);  // drop projects marked hidden: true
  const full = `${P.firstName} ${P.lastName}`;
  const baseTitle = `${full} — ${P.title || "Engineering Portfolio"}`;
  document.title = baseTitle;
  $("brand-name").textContent = full;
  $("hero-title").textContent = P.title;
  $("hero-tagline").textContent = P.tagline.charAt(0).toUpperCase() + P.tagline.slice(1);
  $("hero-accent").textContent = P.taglineAccent;
  $("hero-lede").textContent = P.lede;
  $("status").textContent = P.status;
  $("loc").textContent = P.location;
  $("edu").textContent = P.education;
  $("resume-btn").href = P.resumeUrl;
  $("footer-name").textContent = full;
  $("year").textContent = new Date().getFullYear();
  $("avatar").innerHTML = P.photo ? `<img src="${P.photo}" alt="${full}">` : `<span class="initials">${P.initials}</span>`;

  $("vitals").innerHTML = P.vitals.map(v => `
    <div class="vital reveal">
      <div class="label">${v.label || "Vital"}</div>
      <div class="num">${v.num}<sup>${v.suffix}</sup></div>
      <div class="desc">${v.desc}</div>
    </div>`).join("");

  const cats = ["All", "Startups", "Research", "Personal"];  /* filter order */
  $("filters").innerHTML = cats.map((c, i) =>
    `<button class="${i === 0 ? "active" : ""}" data-cat="${c}">${c}</button>`).join("");

  const ARROW = `<svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>`;
  $("projects").innerHTML = P.projects.map((p, i) => `
    <a href="#/work/${p.slug}" class="project ${p.size} reveal" data-cat="${p.category}">
      <div class="project-media">
        <span class="ph">FIG. ${String(i + 1).padStart(2, "0")} — ADD IMAGE</span>
        ${!p.img ? "" : /\.(mp4|webm|mov)$/i.test(p.img)
          ? `<video src="${p.img}" poster="${p.imgPoster || ""}" autoplay muted loop playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:${p.imgPos || "center"}"></video>`
          : `<img src="${p.img}" alt="${p.title}" loading="lazy" style="object-position:${p.imgPos || "center"}">`}
        <span class="project-tag">${p.tag}</span>
      </div>
      <div class="project-body">
        <span class="card-date">${(p.detail.when || "").split(" · ")[0]}</span>
        <h3>${p.title}<span class="arrow">${ARROW}</span></h3>
        <p>${p.desc}</p>
        <div class="chips">${p.tools.map(t => `<span class="chip">${t}</span>`).join("")}</div>
      </div>
    </a>`).join("");

  $("filters").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$("filters").children].forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll(".project").forEach(card =>
      card.classList.toggle("hide", b.dataset.cat !== "All" && card.dataset.cat !== b.dataset.cat));
  });

  const ICONS = {
    cube: '<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/>',
    pulse: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
    wrench: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
    code: '<path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/>',
    chip: '<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
    pen: '<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/>',
    film: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
  };
  const MAX_YRS = Math.max(...P.capabilities.flatMap(c => c.skills.map(s => s[1])));
  const fmtYrs = y => y < 1
    ? `${Math.round(y * 12)} mo${Math.round(y * 12) > 1 ? "s" : ""}`
    : `${+y.toFixed(1)} yr${y > 1 ? "s" : ""}`;
  $("caps").innerHTML = P.capabilities.map(c => `
    <div class="cap reveal">
      <div class="cap-icon"><svg viewBox="0 0 24 24">${ICONS[c.icon] || ICONS.cube}</svg></div>
      <h3>${c.name}</h3>
      ${c.skills.map(([n, y]) => `
        <div class="meter">
          <div class="meter-top"><span>${n}</span><span>${fmtYrs(y)}</span></div>
          <div class="meter-bar"><div class="meter-fill" data-w="${Math.max(3, y / MAX_YRS * 100)}"></div></div>
        </div>`).join("")}
      ${c.tags ? `<div class="chips">${c.tags.map(t => `<span class="chip">${t}</span>`).join("")}</div>` : ""}
    </div>`).join("");

  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmtMonth = ym => { const [y, m] = ym.split("-").map(Number); return `${MON[m - 1]} ${y}`; };
  const span = (a, b) => {
    const [y1, m1] = a.split("-").map(Number);
    const now = new Date(), [y2, m2] = b ? b.split("-").map(Number) : [now.getFullYear(), now.getMonth() + 1];
    const n = (y2 - y1) * 12 + (m2 - m1) + 1, y = Math.floor(n / 12), m = n % 12;
    return [y && `${y} yr${y > 1 ? "s" : ""}`, m && `${m} mo${m > 1 ? "s" : ""}`].filter(Boolean).join(" ");
  };
  const L = P.learning;
  $("learn-intro").textContent = L.intro;
  $("principles").innerHTML = L.principles.map((x, i) => `
    <div class="principle reveal"><span class="pnum">${String(i + 1).padStart(2, "0")}</span><h3>${x.title}</h3><p>${x.text}</p></div>`).join("");
  $("learn").innerHTML = L.items.map(x => `
    <article class="learn-card reveal">
      ${x.img ? `<a class="learn-media" href="${x.imgLink || "#"}" target="_blank" rel="noopener"><img src="${x.img}" alt="${x.title}" loading="lazy" style="object-position:${x.imgPos || "center"}"></a>` : ""}
      <div class="learn-top"><span class="learn-kind">${x.kind}</span><span class="label">${x.when}</span></div>
      <h3>${x.title}</h3>
      ${x.stats ? `<div class="learn-stats">${x.stats.map(([n, l]) => `<span><b>${n}</b> ${l}</span>`).join("")}</div>` : ""}
      <p>${x.text}</p>
      <div class="learn-parts">${x.parts.map(([n, t, u]) =>
        `<a href="${u}" target="_blank" rel="noopener"><span>${n}</span><b>${t}</b><i>↗</i></a>`).join("")}</div>
      ${x.link ? `<a class="learn-link" href="${x.link[1]}" target="_blank" rel="noopener">${x.link[0]} ↗</a>` : ""}
    </article>`).join("");

  $("exp").innerHTML = P.experience.map(x => `
    <div class="exp-item reveal">
      <span class="when">${fmtMonth(x.start)} — ${x.end ? fmtMonth(x.end) : "Present"}<em>${span(x.start, x.end)}</em></span>
      <div><h4>${x.role}</h4><p>${x.org}</p>${x.note ? `<p class="note">${x.note}</p>` : ""}</div>
      <span class="badge ${x.now ? "now" : ""}">${x.badge}</span>
    </div>`).join("");

  $("contact-links").innerHTML = P.contact.map(c =>
    `<a href="${c.href}" ${c.href.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}><span>${c.label}</span><span>${c.value}</span></a>`).join("");

  /* ---------- CASE STUDY PAGE ---------- */
  function renderDetail(p) {
    const d = p.detail, i = P.projects.indexOf(p), next = P.projects[(i + 1) % P.projects.length];
    const coverSrc = d.cover || p.img;
    const yt = id => `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0${d.videoStart ? "&start=" + d.videoStart : ""}" title="${p.title} video" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    const cover = d.coverVideo && d.video ? yt(d.video) : !coverSrc ? "" : /\.(mp4|mov|webm)$/i.test(coverSrc)
      ? `<video src="${coverSrc}" autoplay muted loop playsinline style="object-position:${d.coverPos || "center"}"${d.coverPoster ? ` poster="${d.coverPoster}" data-fallback="${encodeURIComponent(`<img src="${d.coverPoster}" alt="" style="object-position:${d.coverPos || "center"}">`)}"` : ""}></video>`
      : `<img src="${coverSrc}" alt="${p.title}" style="object-position:${d.coverPos || "center"}">`;
    const sections = d.video && !d.coverVideo ? [...d.sections, { h: "Watch the video", html:
      `<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${d.video}?rel=0${d.videoStart ? "&start=" + d.videoStart : ""}" title="${p.title} video" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>` }] : d.sections;
    $("detail").innerHTML = `
      <article class="detail">
        <a href="#work" class="back">← All case studies</a>
        <header class="d-hero">
          <div class="label"><span class="dot"></span>${p.tag} · ${d.org}</div>
          <h1>${p.title}</h1>
          <p class="lede">${d.subtitle}</p>
        </header>
        <div class="d-meta">
          <div><span class="label">Role</span><b>${d.role}</b></div>
          <div><span class="label">Timeline</span><b>${d.when}</b></div>
          <div><span class="label">Organization</span><b>${d.org}</b></div>
          <div><span class="label">Tools</span><b>${p.tools.join(", ")}</b></div>
        </div>
        <div class="d-cover"${d.coverRatio ? ` style="aspect-ratio:${d.coverRatio}"` : ""}>${cover}</div>
        <div class="d-body">
          ${sections.map((s, k) => `
            <section class="d-sec">
              <div class="d-num"><span></span>${String(k + 1).padStart(2, "0")}</div>
              <div><h2>${s.h}</h2><div class="prose">${s.html}</div></div>
            </section>`).join("")}
        </div>
        ${d.links && d.links.length ? `<div class="d-links">${d.links.map(([l, u]) =>
          `<a href="${u}" target="_blank" rel="noopener">${l} ↗</a>`).join("")}</div>` : ""}
        <a href="#/work/${next.slug}" class="d-next">
          <div><div class="label">Next case study</div><h3>${next.title}</h3></div>
          <span class="arrow">${ARROW}</span>
        </a>
      </article>`;
  }

  /* ---------- ROUTER: #/work/<slug> opens a case study ---------- */
  function route() {
    const m = location.hash.match(/^#\/work\/([\w-]+)/);
    const proj = m && P.projects.find(x => x.slug === m[1]);
    if (proj) {
      renderDetail(proj);
      $("home").hidden = true; $("detail").hidden = false;
      document.title = `${proj.title} — ${full}`;
      window.scrollTo({ top: 0, behavior: "instant" });
      return;
    }
    const wasDetail = !$("detail").hidden;
    $("detail").hidden = true; $("home").hidden = false; $("detail").innerHTML = "";
    document.title = baseTitle;
    const target = location.hash.length > 1 && document.getElementById(location.hash.slice(1));
    if (target) requestAnimationFrame(() => target.scrollIntoView({ behavior: wasDetail ? "instant" : "smooth" }));
  }
  window.addEventListener("hashchange", route);

  /* ---------- SCROLL REVEAL + METERS ---------- */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add("in");
      en.target.querySelectorAll(".meter-fill").forEach(f => f.style.width = f.dataset.w + "%");
      io.unobserve(en.target);
    });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  /* =========================================================
     CROP TOOL
     ========================================================= */
  (function () {
    const KEY = "cropDraft";
    let draft = {};
    try { draft = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
    const saveDraft = () => { try { localStorage.setItem(KEY, JSON.stringify(draft)); } catch (e) {} };
    const all = () => { const o = Object.assign({}, CROPS, draft); Object.keys(o).forEach(k => o[k] === null && delete o[k]); return o; };
    const ctxOf = el => el.closest(".project-media") ? "card" : el.closest(".d-cover") ? "cover" : el.closest(".learn-media") ? "learn" : el.closest(".avatar") ? "avatar" : "fig";
    const keyOf = el => ctxOf(el) + "|" + (el.getAttribute("src") || "");
    const ensureClip = el => {
      if (ctxOf(el) !== "fig" || el.parentElement.classList.contains("crop-clip")) return;
      const w = document.createElement("span"); w.className = "crop-clip";
      el.parentNode.insertBefore(w, el); w.appendChild(el);
    };
    function apply(el) {
      if (!el.matches || !el.matches("img, video") || el.closest(".crop-ui")) return;
      if (el.dataset.origStyle === undefined) el.dataset.origStyle = el.getAttribute("style") || "";
      el.setAttribute("style", el.dataset.origStyle);
      const c = all()[keyOf(el)]; if (!c) return;
      const x = c.x ?? 50, y = c.y ?? 50, z = c.zoom || 1;
      el.style.objectFit = c.fit || "cover";
      el.style.objectPosition = `${x}% ${y}%`;
      if (c.ratio && ctxOf(el) === "fig") { el.style.aspectRatio = c.ratio; el.style.width = "100%"; el.style.height = "auto"; el.style.maxHeight = "none"; }
      if (z > 1) { ensureClip(el); el.style.transform = `scale(${z})`; el.style.transformOrigin = `${x}% ${y}%`; }
    }
    const applyAll = (root = document) => root.querySelectorAll("img, video").forEach(apply);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
      if (n.nodeType !== 1) return;
      if (n.matches("img, video")) apply(n); else applyAll(n);
    }))).observe(document.body, { childList: true, subtree: true });
    applyAll();

    /* ---- editor UI ---- */
    let on = false, sel = null, drag = null;
    const RATIOS = [["Original", ""], ["1:1", "1/1"], ["4:5", "4/5"], ["4:3", "4/3"], ["3:2", "3/2"], ["16:9", "16/9"], ["9:16", "9/16"], ["3:1", "3/1"]];
    const ui = document.createElement("div"); ui.className = "crop-ui"; ui.hidden = true;
    ui.innerHTML = `
      <div class="crop-bar">
        <span><b>✂ Crop mode</b> · click any image</span>
        <button data-a="copy">Copy code</button><button data-a="clear">Clear all</button><button data-a="exit">Exit</button>
      </div>
      <div class="crop-panel" hidden>
        <div class="crop-name"></div>
        <div class="crop-row crop-ratios"><label>Shape</label><div>${RATIOS.map(([l, v]) => `<button data-r="${v}">${l}</button>`).join("")}</div></div>
        <div class="crop-row"><label>Fit</label><div><button data-f="cover">Fill & crop</button><button data-f="contain">Show all</button></div></div>
        <div class="crop-row"><label>Zoom <i data-v="zoom"></i></label><input type="range" min="1" max="3" step="0.05" data-k="zoom"></div>
        <div class="crop-row"><label>Left ↔ right <i data-v="x"></i></label><input type="range" min="0" max="100" step="1" data-k="x"></div>
        <div class="crop-row"><label>Top ↕ bottom <i data-v="y"></i></label><input type="range" min="0" max="100" step="1" data-k="y"></div>
        <p class="crop-hint">Tip: drag the image itself to reposition it.</p>
        <div class="crop-actions"><button data-a="reset">Reset this image</button><button data-a="done" class="primary">Done</button></div>
      </div>
      <div class="crop-modal" hidden><div><h4>Paste this into index.html</h4><p>Replace the line <code>const CROPS = {};</code> (near the top of the file, under "CROP TOOL") with:</p><textarea readonly></textarea><div class="crop-actions"><button data-a="close" class="primary">Close</button></div></div></div>`;
    document.body.appendChild(ui);
    const panel = ui.querySelector(".crop-panel"), modal = ui.querySelector(".crop-modal");
    const cur = () => sel ? (all()[keyOf(sel)] || {}) : {};
    const setCur = patch => {
      if (!sel) return;
      const n = Object.assign({ x: 50, y: 50, zoom: 1, fit: "cover", ratio: "" }, cur(), patch);
      n.x = Math.round(n.x * 10) / 10; n.y = Math.round(n.y * 10) / 10; n.zoom = Math.round(n.zoom * 100) / 100;
      draft[keyOf(sel)] = n;
      saveDraft(); document.querySelectorAll("img, video").forEach(el => keyOf(el) === keyOf(sel) && apply(el)); sync();
    };
    function sync() {
      if (!sel) return;
      const c = Object.assign({ x: 50, y: 50, zoom: 1, fit: "cover", ratio: "" }, cur());
      ui.querySelector(".crop-name").textContent = `${ctxOf(sel)} · ${(sel.getAttribute("src") || "").split("/").pop().split("?")[0]}`;
      ui.querySelector(".crop-ratios").style.display = ctxOf(sel) === "fig" ? "" : "none";
      ui.querySelectorAll("[data-r]").forEach(b => b.classList.toggle("on", b.dataset.r === (c.ratio || "")));
      ui.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("on", b.dataset.f === c.fit));
      ui.querySelectorAll("[data-k]").forEach(i => { i.value = c[i.dataset.k]; });
      ui.querySelector('[data-v="zoom"]').textContent = (+c.zoom).toFixed(2) + "×";
      ui.querySelector('[data-v="x"]').textContent = Math.round(c.x) + "%";
      ui.querySelector('[data-v="y"]').textContent = Math.round(c.y) + "%";
    }
    const select = el => {
      document.querySelectorAll(".crop-selected").forEach(e => e.classList.remove("crop-selected"));
      sel = el; if (el) { el.classList.add("crop-selected"); panel.hidden = false; sync(); } else panel.hidden = true;
    };
    const toggle = v => { on = v; ui.hidden = !on; document.body.classList.toggle("crop-mode", on); if (!on) select(null); };
    const mediaFrom = t => {
      if (t.closest(".crop-ui")) return null;
      if (t.matches("img, video")) return t;
      const box = t.closest("figure, .project-media, .d-cover, .learn-media, .avatar");
      return box ? box.querySelector("img, video") : null;
    };
    document.addEventListener("click", e => {
      if (!on) return; const m = mediaFrom(e.target); if (!m) return;
      e.preventDefault(); e.stopPropagation(); if (m !== sel) select(m);
    }, true);
    document.addEventListener("pointerdown", e => {
      if (!on || !sel) return; const m = mediaFrom(e.target); if (m !== sel) return;
      e.preventDefault(); const r = sel.getBoundingClientRect(), c = Object.assign({ x: 50, y: 50, zoom: 1 }, cur());
      drag = { sx: e.clientX, sy: e.clientY, x: c.x, y: c.y, w: r.width, h: r.height, z: c.zoom };
    }, true);
    window.addEventListener("pointermove", e => {
      if (!drag) return; const k = 1.6 / drag.z;
      setCur({ x: Math.max(0, Math.min(100, drag.x - (e.clientX - drag.sx) / drag.w * 100 * k)),
               y: Math.max(0, Math.min(100, drag.y - (e.clientY - drag.sy) / drag.h * 100 * k)) });
    });
    window.addEventListener("pointerup", () => { drag = null; });
    ui.addEventListener("input", e => { const k = e.target.dataset.k; if (k) setCur({ [k]: +e.target.value }); });
    ui.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.r !== undefined) return setCur({ ratio: b.dataset.r });
      if (b.dataset.f) return setCur({ fit: b.dataset.f });
      const a = b.dataset.a;
      if (a === "reset" && sel) { const k = keyOf(sel); if (CROPS[k]) draft[k] = null; else delete draft[k]; saveDraft(); document.querySelectorAll("img, video").forEach(el => keyOf(el) === k && apply(el)); sync(); }
      if (a === "done") select(null);
      if (a === "exit") toggle(false);
      if (a === "clear" && confirmClear()) { draft = {}; saveDraft(); applyAll(); sync(); }
      if (a === "copy") {
        const text = "const CROPS = " + JSON.stringify(all(), null, 2) + ";";
        const ta = modal.querySelector("textarea"); ta.value = text; modal.hidden = false; ta.select();
        try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (err) {}
      }
      if (a === "close") modal.hidden = true;
    });
    function confirmClear() { b = ui.querySelector('[data-a="clear"]'); if (b.dataset.armed) { delete b.dataset.armed; b.textContent = "Clear all"; return true; } b.dataset.armed = 1; b.textContent = "Click again to clear"; setTimeout(() => { delete b.dataset.armed; b.textContent = "Clear all"; }, 3000); return false; }
    var b;
    document.addEventListener("keydown", e => { if (e.altKey && e.shiftKey && e.code === "KeyC") toggle(!on); if (on && e.key === "Escape") select(null); });
    if (/[?&]crop\b/.test(location.search)) toggle(true);
    /* Click a playing video to turn its sound on or off */
    document.addEventListener("click", e => {
      const v = e.target.closest(".prose video, .d-cover video");
      if (!v || v.controls || document.body.classList.contains("crop-mode")) return;
      v.muted = !v.muted; if (v.paused) v.play();
    });
    /* A small "Crop images" button, shown only when you open the file on your own computer */
    if (location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      const cb = document.createElement("button");
      cb.type = "button"; cb.textContent = "✂ Crop images"; cb.title = "Edit image crops (Option/Alt+Shift+C)";
      cb.style.cssText = "position:fixed;left:16px;bottom:16px;z-index:9998;border:0;border-radius:999px;padding:9px 14px;font:500 12.5px var(--sans, system-ui);background:var(--text);color:var(--bg);cursor:pointer;opacity:.85";
      cb.addEventListener("click", () => toggle(!on));
      document.body.appendChild(cb);
    }
  })();

  route();
</script>
</body>
</html>
